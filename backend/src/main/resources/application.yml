server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: parking-heatmap

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parking_heatmap}
    username: ${SPRING_DATASOURCE_USERNAME:parking}
    password: ${SPRING_DATASOURCE_PASSWORD:parking123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
